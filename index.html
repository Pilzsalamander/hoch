<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hier & jetzt</title>
<style>
  :root {
    --bg: #eef1ec; --panel: #ffffff; --ink: #1d2a24; --muted: #66756c;
    --line: #cfd8d0; --north: #d9381e; --accent: #2f6b4f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101713; --panel: #18211b; --ink: #e7efe9; --muted: #8fa196;
      --line: #2c3a31; --north: #ff6a4d; --accent: #7fcf9f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 18px; }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0; }
  .compass { background: var(--panel); border: 1px solid var(--line); border-radius: 50%;
    width: min(78vw, 340px); aspect-ratio: 1; margin: 0 auto; position: relative; }
  .compass svg { width: 100%; height: 100%; display: block; }
  #dial { transition: transform .12s linear; transform-origin: 50% 50%; }
  .heading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .heading b { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .heading span { color: var(--muted); font-size: 1rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stat b { display: block; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .9rem; }
  .stat small { display: block; margin-top: 4px; color: var(--muted); font-size: .78rem; min-height: 1em; }
  button { font: inherit; font-weight: 600; padding: 12px 18px; border-radius: 12px; border: 0;
    background: var(--accent); color: var(--bg); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #msg { text-align: center; color: var(--muted); font-size: .9rem; min-height: 1.3em; margin: 0; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1 id="place">Standort wird gesucht …</h1>

  <div class="compass">
    <svg viewBox="-100 -100 200 200" aria-hidden="true">
      <g id="dial">
        <g stroke="var(--line)" stroke-width="1">
          <script>/* Ticks werden unten per JS erzeugt */</script>
        </g>
        <g id="ticks"></g>
        <polygon points="0,-72 8,-48 -8,-48" fill="var(--north)"/>
        <text x="0" y="-78" text-anchor="middle" font-size="14" font-weight="700" fill="var(--north)">N</text>
        <text x="80" y="5" text-anchor="middle" font-size="12" fill="var(--muted)">O</text>
        <text x="0" y="90" text-anchor="middle" font-size="12" fill="var(--muted)">S</text>
        <text x="-80" y="5" text-anchor="middle" font-size="12" fill="var(--muted)">W</text>
      </g>
      <polygon points="0,-96 4,-88 -4,-88" fill="var(--ink)"/>
    </svg>
    <div class="heading"><b id="deg">–</b><span id="dir">Kompass aus</span></div>
  </div>

  <div class="stats">
    <div class="stat"><span>Höhe über Meer</span><b id="alt">–</b><small id="altsub"></small></div>
    <div class="stat"><span>Temperatur</span><b id="temp">–</b><small id="tempsub"></small></div>
  </div>

  <div class="row">
    <button id="compassBtn" type="button">Kompass starten</button>
    <button id="refreshBtn" type="button">Standort aktualisieren</button>
  </div>
  <p id="msg"></p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t) { $("msg").textContent = t || ""; };

  // Skala zeichnen
  var ticks = "";
  for (var i = 0; i < 72; i++) {
    var long = i % 6 === 0, a = i * 5 * Math.PI / 180;
    var r1 = long ? 56 : 62, r2 = 68;
    if (i === 0) continue;
    ticks += '<line x1="' + (Math.sin(a) * r1).toFixed(2) + '" y1="' + (-Math.cos(a) * r1).toFixed(2) +
      '" x2="' + (Math.sin(a) * r2).toFixed(2) + '" y2="' + (-Math.cos(a) * r2).toFixed(2) +
      '" stroke="var(--muted)" stroke-width="' + (long ? 1.6 : 0.8) + '"/>';
  }
  $("ticks").innerHTML = ticks;

  // ---------- Standort, Höhe, Temperatur ----------
  function getJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function load() {
    if (!navigator.geolocation) { msg("Dieser Browser unterstützt keine Standortabfrage."); return; }
    msg("Standort wird abgefragt …");
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      $("place").textContent = lat.toFixed(4) + "° N, " + lon.toFixed(4) + "° O";
      msg("");

      var gps = pos.coords.altitude;
      var gpsTxt = gps != null ? "GPS: " + Math.round(gps) + " m" : "";

      getJSON("https://api.open-meteo.com/v1/elevation?latitude=" + lat + "&longitude=" + lon)
        .then(function (d) {
          var e = d.elevation && d.elevation[0];
          $("alt").textContent = Math.round(e) + " m";
          $("altsub").textContent = gpsTxt ? "Geländemodell · " + gpsTxt : "Geländemodell";
        })
        .catch(function () {
          if (gps != null) { $("alt").textContent = Math.round(gps) + " m"; $("altsub").textContent = "nur GPS"; }
          else { $("alt").textContent = "–"; $("altsub").textContent = "nicht verfügbar"; }
        });

      getJSON("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
        "&current=temperature_2m,apparent_temperature")
        .then(function (d) {
          var c = d.current;
          $("temp").textContent = Math.round(c.temperature_2m * 10) / 10 + " °C";
          $("tempsub").textContent = "gefühlt " + Math.round(c.apparent_temperature) + " °C";
        })
        .catch(function () { $("temp").textContent = "–"; $("tempsub").textContent = "nicht verfügbar"; });
    }, function (err) {
      var t = { 1: "Standortzugriff verweigert. Bitte in den Browser-Einstellungen erlauben.",
                2: "Standort nicht verfügbar.", 3: "Standortabfrage hat zu lange gedauert." };
      msg(t[err.code] || "Standortfehler.");
      $("place").textContent = "Kein Standort";
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  }

  // ---------- Kompass ----------
  var names = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
  var listening = false;

  function onOrient(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;            // iOS
    else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;                      // Android
    if (h == null) return;
    h = (h + 360) % 360;
    $("dial").style.transform = "rotate(" + (-h) + "deg)";
    $("deg").textContent = Math.round(h) + "°";
    $("dir").textContent = names[Math.round(h / 45) % 8];
  }

  function startCompass() {
    var start = function () {
      if (listening) return;
      listening = true;
      window.addEventListener("deviceorientationabsolute", onOrient, true);
      window.addEventListener("deviceorientation", onOrient, true);
      msg("");
      $("compassBtn").textContent = "Kompass läuft";
      setTimeout(function () {
        if ($("deg").textContent === "–") msg("Keine Kompassdaten. Auf dem Computer gibt es meist keinen Sensor – am Handy öffnen.");
      }, 2500);
    };
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (s) {
        if (s === "granted") start(); else msg("Zugriff auf Bewegungssensoren verweigert.");
      }).catch(function () { msg("Kompass konnte nicht gestartet werden."); });
    } else start();
  }

  $("compassBtn").addEventListener("click", startCompass);
  $("refreshBtn").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
